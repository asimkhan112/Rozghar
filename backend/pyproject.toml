[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plenilo-backend"
version = "0.1.0"
description = "Plenilo.com job board API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    # Alembic connects through `sync_database_url`, so the sync driver is a
    # runtime dependency wherever migrations run — which is every boot, since
    # `alembic upgrade head` is the first half of the deploy start command.
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "greenlet>=3.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "redis>=5.2",
    "apscheduler>=3.11",
    # Runtime, not just tests: the USAJOBS importer calls out over HTTP.
    "httpx>=0.28",
    "prometheus-client>=0.21",
    "pillow>=11.0",
    "qrcode>=8.0",
    "anthropic>=0.116",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "httpx2>=0.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"*" = ["assets/fonts/*.ttf"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The search_vector expression must match the migration exactly; wrapping it
# would make the two harder to diff against each other.
"app/models/job.py" = ["E501"]
"tools/*" = ["E501"]
# Column definitions read better on one line than wrapped across three.
"alembic/versions/*" = ["E501"]
# Star import is how the model package registers tables on the metadata.
"alembic/env.py" = ["F403"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
